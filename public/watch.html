<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CineSync Watch Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="joinModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Choose your name</h3>
      <form id="joinForm">
        <input type="text" id="usernameInput" placeholder="Display Name" required autofocus>
        <button type="submit">Join Watch Party</button>
      </form>
    </div>
  </div>

  <div class="app-container" id="app-container">
    <div class="video-section">
      <header id="player-header">
        <h2>CineSync <span id="userCountBadge" style="font-size: 0.9rem; color: #10b981; font-weight: normal; margin-left: 0.5rem;"></span></h2>
        <button class="share-btn" id="shareBtn">Share Link</button>
      </header>
      
      <div id="player-wrapper">
        <video id="player" preload="metadata" playsinline crossorigin="anonymous">
          <track id="cc-track" kind="subtitles" src="/media/subtitles.vtt" default>
        </video>
        
        <div class="controls-bar" id="controls-bar">
          <div class="scrubber-container" id="scrubber">
            <div class="scrubber-fill" id="scrubber-fill"></div>
            <div class="scrubber-hover-time" id="scrubber-hover">00:00</div>
          </div>
          
          <div class="controls-row">
            <div class="controls-left">
              <button class="control-btn" id="btn-playpause">▶</button>
              <button class="control-btn" id="btn-skipback">↺</button>
              <button class="control-btn" id="btn-skipfwd">↻</button>
              <div class="volume-container">
                <button class="control-btn" id="btn-mute">🔊</button>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
              </div>
              <span class="time-display" id="time-display">00:00 / 00:00</span>
            </div>
            
            <div class="controls-right">
              <button class="control-btn" id="btn-chat">💬</button>
              <button class="control-btn" id="btn-cc">CC</button>
              <button class="control-btn" id="btn-fullscreen">⛶</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <span>Room Chat</span>
        <button class="control-btn" id="btn-close-chat" style="width: 24px; height: 24px; font-size: 0.8rem;">✕</button>
      </div>
      <div class="chat-messages" id="chatFeed"></div>
      
      <div class="chat-input-area">
        <div class="reactions-bar">
          <button class="reaction-btn">🔥</button>
          <button class="reaction-btn">😂</button>
          <button class="reaction-btn">🍿</button>
          <button class="reaction-btn">❤️</button>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Send a message...">
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
